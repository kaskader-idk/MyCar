name: iOS build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Test tire data and migration
        run: |
          swiftc MyCarShared/GarageModels.swift Tests/main.swift -o /tmp/mycar-model-checks
          /tmp/mycar-model-checks
      - name: Build iOS Simulator app and widgets
        run: |
          xcodebuild -project MyCar.xcodeproj -scheme MyCar \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project MyCar.xcodeproj -scheme MyCar \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for sideloading
        run: |
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/MyCar.app Payload/
          zip -qr MyCar-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyCar-unsigned-ipa
          path: MyCar-unsigned.ipa
          if-no-files-found: error
